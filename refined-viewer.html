<!doctype html>

<title>Refined Cases JSON Viewer</title>
<style>
:root {
  --bg:#0f1115; --card:#171a21; --mut:#8b95a7; --fg:#e7ecf3; --line:#262b36;
  --acc:#3b82f6; --prebg:#0d1017;
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
header { position:sticky; top:0; z-index:10; background:#0f1115ee; backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line); padding:14px 20px; }
h1 { font-size:17px; margin:0 0 6px; font-weight:600; }
h1 span { font-weight:400; color:var(--mut); font-size:12px; }
.controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:8px; }
input, select, button {
  background:var(--card); color:var(--fg); border:1px solid var(--line);
  border-radius:6px; padding:7px 10px; font-size:13px; }
select { min-width: 420px; max-width: 680px; }
button { cursor:pointer; }
button.primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
main { max-width: 1100px; margin: 0 auto; padding: 18px 20px; }
#meta { font-family: ui-monospace, monospace; font-size:12px; color:var(--mut); margin: 0 0 8px; }
#display {
  background: var(--prebg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  min-height: 420px;
  max-height: 78vh;
  overflow: auto;
  white-space: pre;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  font-size: 12.5px;
  line-height: 1.5;
  color: #d1d9e3;
}
#display:empty::before {
  content: "Select a file from the dropdown above";
  color: var(--mut);
  font-style: italic;
}
.footer { margin-top:12px; font-size:11px; color:var(--mut); }
a { color:#7aa2f7; text-decoration:none; }
a:hover { text-decoration:underline; }
</style>
</head>

 bindings, including trap type, domain name, from and to states, control VLAN ID, primary/secondary port indices, and port states.</li><li>MIB table entries (e.g. atEpsrv2VariablesTable) and individual EPSR variables function as expected and are consistent with show commands.</li><li>EPSR MIB support includes proper trap notifications and handles documented behaviors such as fromState returning \"unknown\" (6) in certain conditions.</li></ul>", "testScript": {"type": "STEP_BY_STEP", "steps": [{"description": "Note: Related ART Tests linked in Traceability. Primary coverage from TestLink EPSR MIB family (AWP-3991, AWP-1498, AWP-10347, AWP-4009, AWP-4010, AWP-1310, AWP-25021 and related). ART coverage from 5704 (AT-EPSRv2 MIB) and 1334 (EPSR trap behavior).", "expectedResult": ""}, {"description": "Configure an EPSR domain with a specific priority and ports. Query the AT-EPSRv2-MIB (and atr-MIB) OIDs for domain priority and confirm values match the CLI show output.", "expectedResult": ""}, {"description": "Verify EPSR-SLP specific MIB variables (domain priority, primary/secondary IsOnCommonSegment and HasControlOfPortBlocking flags) via SNMP and confirm they reflect the current EPSR state as per CLI.", "expectedResult": ""}, {"description": "Configure SNMP trap host and EPSR traps. Induce EPSR state changes to trigger master and transit node scenarios. Capture traps and verify all bindings (trap type, domain name, from/to states, control VLAN, primary/secondary port and state) match expectations.", "expectedResult": ""}, {"description": "Query the atEpsrv2VariablesTable and key EPSR MIB objects. Confirm the table and variables are populated correctly and consistent with device EPSR status.", "expectedResult": ""}, {"description": "Test MIB access in different EPSR roles (master, transit) and states. Confirm values update correctly and traps are sent with appropriate state transitions.", "expectedResult": ""}, {"description": "Verify that documented MIB behaviors are o ry enabled completes successfully with no loop forming at any time.</li><li>Multiple and partial link failures/recoveries with enhanced recovery allow traffic to flow in recovered segments while the ring returns to the complete state.</li><li>Enhanced recovery uses the Link Forward Request / Permission Link Forward protocol to optimize recovery compared to standard EPSR behavior.</li></ul>", "testScript": {"type": "STEP_BY_STEP", "steps": [{"description": "Note: Related ART Tests linked in Traceability. Primary coverage from TestLink Enhanced Recovery family (AWP-145, AWP-4076, AWP-4077, AWP-4078, AWP-4083, AWP-4084, AWP-4086 and related multi-domain cases). ART coverage from 1334.3001.6-10 (Link Forward Request / Permission Link Forward protocol on master and transit) + 1340 (CR41421 timing).", "expectedResult": ""}, {"description": "Configure an EPSR domain and enable enhanced recovery (`epsr <ep> enhancedrecovery enable`). Confirm the configuration is accepted and show epsr reports the mode as enabled for the domain.", "expectedResult": ""}, {"description": "With enhanced recovery enabled on a transit node, induce a port down/up (or link failure/recovery). Verify that a Link Forward Request is sent on the control VLAN and that a Permission Link Forward response causes the port to transition to forwarding.", "expectedResult": ""}, {"description": "Perform the equivalent port/link recovery on the master node with enhanced recovery enabled. Confirm the master transmits Permission Link Forward as expected and the ring returns to Complete state with no loop.", "expectedResult": ""}, {"description": "Configure multiple EPSR domains. Enable enhanced recovery on some domains only. Induce failures and verify that recovery (forwarding / traffic flow) occurs only on the domains where enhanced recovery is enabled.", "expectedResult": ""}, {"description": "Test single link failure + recovery with enhanced recovery enabled. Confirm no loop forms at any time and the ring returns to Complete state.", "expectedResult": ""}, {"description": "Test multiple link failures (two or more) followed by partial then full recovery. Confirm recovered segments allow traffic flow and the full ring eventually reaches Complete state with no loops.", "expectedResult": ""}, {"description": "Verify that disabling enhanced recovery on the master or a transit changes recovery behavior for that domain (e.g. segments do not forward until full ring recovery).", "expectedResult": ""}]}}}, "zephyr": {"key": "AWPTCM-T33275", "name": "(103) Switching_EPSR - Enhanced Recovery", "folder": "/New Platform Test (MASTER)/New Platform Template/Switching", "objective": "<ul><li>Enhanced recovery mode can be enabled and disabled per EPSR domain via CLI.</li><li>When enhanced recovery is enabled on a transit node, a Link Forward Request is transmitted on the control VLAN when a port comes up.</li><li>When a Permission Link Forward is received in response to a Link Forward Request, the port transitions to the forwarding state.</li><li>The EPSR master transmits a Permission Link Forward in response to a Link Forward Request when no health checks are circulating.</li><li>Enhanced recovery behavior is independent per domain: disabling the mode on the master or on a transit affects recovery only for domains where it is disabled.</li><li>Single link failure and recovery with enhanced recovery enabled completes successfully with no loop forming at any time.</li><li>Multiple and partial link failures/recoveries with enhanced recovery allow traffic to flow in recovered segments while the ring returns to the complete state.</li><li>Enhanced recovery uses the Link Forward Request / Permission Link Forward protocol to optimize recovery compared to standard EPSR behavior.</li></ul>", "precondition": "", "priority": "Normal", "status": "Draft", "labels": ["New_Platform_Switching"], "testScript": {"type": "STEP_BY_STEP", "steps": [{"description": "Note: Related ART Tests linked in Traceabilit ses/Switching (75)/AWPTCM-T33279/zephyr_payload.json": {"source": {"AWPTCM-T33279": {"objective": "<ul><li>The spanning-tree bpdu forward (and related forward-untagged-vlan, forward-vlan, discard) commands are available under the spanning-tree configuration context.</li><li>When any spanning tree protocol (STP, RSTP or MSTP) is enabled, the BPDU Forwarding setting is automatically disabled and removed from the running configuration.</li><li>BPDU Forwarding can be explicitly disabled with the discard option; the disabled form does not appear in the running config.</li><li>When BPDU Forwarding is active, BPDUs are forwarded without VLAN tags on the wire (even on trunk ports).</li><li>When using forward-untagged-vlan or forward-vlan options, BPDUs are forwarded only to ports in the matching VLAN(s).</li><li>Static channel groups (LAGs) are treated as a single logical port for BPDU forwarding purposes.</li><li>BPDU Forwarding inter-operates correctly with features that also generate or consume BPDU-like frames (e.g. 802.1x).</li></ul>", "testScript": {"type": "STEP_BY_STEP", "steps": [{"description": "Note: Related ART Tests linked in Traceability. Primary coverage from TestLink BPDU Forwarding family (AWP-9399, AWP-9400, AWP-9401, AWP-9407, AWP-9409 + platform variants). ART coverage from 1346 (BPDU transmission under RSTP), 2031/2032/2021 (IxANVL RSTP/STP/MSTP BPDU packet and state machine handling).", "expectedResult": ""}, {"description": "Configure `spanning-tree bpdu forward` (and variants forward-untagged-vlan, forward-vlan). Confirm the commands are accepted and appear in running config. Verify `spanning-tree bpdu discard` disables it cleanly.", "expectedResult": ""}, {"description": "With BPDU Forwarding enabled, enable any spanning tree protocol (rstp, stp or mstp). Confirm that the bpdu forward setting is automatically removed from the running config and the feature is disabled.", "expectedResult": ""}, {"description": "With BPDU Forwarding active on a trunk  AWP-26054 G.8032 interop, AWP-7460 CLI show, AWP-7470/1 LAG info, AWP-13785 combo tests). ART coverage from 1346.1001.95 (MAC thrashing link-down detection + action + logging) and nearby loop protection cases.", "expectedResult": ""}, {"description": "Verify MAC thrashing protection is enabled by default. Induce rapid MAC movement (loop) between ports and confirm detection occurs with appropriate logging.", "expectedResult": ""}, {"description": "Configure thrash-limit with action learn-disable (and timeout). Trigger thrashing and verify learning is disabled on the affected port/VLAN and it logs the event.", "expectedResult": ""}, {"description": "Repeat for other actions: link-down, port-disable, vlan-disable. Confirm the port or VLAN enters the expected state and recovers after timeout if configured.", "expectedResult": ""}, {"description": "Configure action none (log only) and verify thrashing is detected and logged without disabling the port or learning.", "expectedResult": ""}, {"description": "Issue show interface switchport (and related commands) while thrashing is active. Confirm the output accurately identifies the thrashing VLANs/ports.", "expectedResult": ""}, {"description": "Configure on G.8032 ring interfaces (with suitable high thrash-limit). Induce ring breaks/restores and confirm MAC thrashing protection functions without disrupting G.8032 operation.", "expectedResult": ""}, {"description": "Test on LAG interfaces and in a stack. Confirm thrashing is detected and action applied correctly (LAG treated as logical unit where appropriate).", "expectedResult": ""}]}}}};
let currentPath = null;
let prettyMode = true;
let viewMode = 'zephyr';   // 'source' or 'zephyr'
let previewMode = 'objective';  // 'objective' or 'steps'

const sel = document.getElementById('sel');
const viewSel = document.getElementById('view');
const pre = document.getElementById('display');
const meta = document.getElementById('meta');
const filter = document.getElementById('filter');
const preview = document.getElementById('preview');

function populateSelect(filterText = '') {
  const q = filterText.toLowerCase().trim();
  sel.innerHTML = '';
  const groups = {};
  for (const p of Object.keys(ALL)) {
    if (q && !p.toLowerCase().includes(q)) continue;
    const cat = p.split('/')[1] || '(root)';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(p);
  }
  const cats = Object.keys(groups).sort();
  for (const cat of cats) {
    const og = document.createElement('optgroup');
    og.label = cat;
    for (const p of groups[cat].sort()) {
      const opt = document.createElement('option');
      opt.value = p;
      opt.textContent = p;
      og.appendChild(opt);
    }
    sel.appendChild(og);
  }
  if (currentPath && ALL[currentPath]) {
    sel.value = currentPath;
  }
}

function formatJSON(obj, minify) {
  if (minify) return JSON.stringify(obj);
  return JSON.stringify(obj, null, 2);
}

function getDisplayObject(path) {
  const entry = ALL[path];
  if (!entry) return null;
  if (entry[viewMode]) return entry[viewMode];
  return entry; // fallback for old data shape
}

function show(path) {
  if (!path || !ALL[path]) return;
  currentPath = path;
  const obj = getDisplayObject(path);
  if (!obj) return;

  const txt = formatJSON(obj, !prettyMode);
  pre.textContent = txt;

  const viewLabel = viewMode === 'zephyr' ? 'Zephyr after-upload' : 'Source payload';
  const topKeys = (obj && typeof obj === 'object') ? Object.keys(obj).length : 0;
  meta.textContent = `${path}  ·  ${viewLabel}  ·  ${topKeys} top-level key(s)`;

  renderPreview(obj);
}

function getObjective(obj) {
  if (!obj) return null;
  if (typeof obj.objective === 'string' && obj.objective.trim().startsWith('<')) {
    return obj.objective;
  }
  if (obj && typeof obj === 'object') {
    // Handle source shape: { "AWPTCM-xxx": { objective: "...", ... } }
    for (const v of Object.values(obj)) {
      if (v && typeof v === 'object' && typeof v.objective === 'string' && v.objective.trim().startsWith('<')) {
        return v.objective;
      }
    }
  }
  return null;
}

function getSteps(obj) {
  if (!obj) return [];
  // Direct zephyr view shape
  if (obj.testScript && Array.isArray(obj.testScript.steps)) {
    return obj.testScript.steps;
  }
  // Source shape or other wrappers
  if (obj && typeof obj === 'object') {
    for (const v of Object.values(obj)) {
      if (v && typeof v === 'object' && v.testScript && Array.isArray(v.testScript.steps)) {
        return v.testScript.steps;
      }
    }
  }
  // Fallback: sometimes steps live at top level (rare)
  if (Array.isArray(obj.steps)) return obj.steps;
  return [];
}

function renderPreview(obj) {
  const controls = document.getElementById('preview-controls');
  const steps = getSteps(obj);
  const objectiveHtml = getObjective(obj);
  const hasObjective = !!(objectiveHtml && objectiveHtml.trim());
  const hasSteps = steps.length > 0;

  if (!hasObjective && !hasSteps) {
    controls.style.display = 'none';
    preview.style.display = 'none';
    preview.innerHTML = '';
    return;
  }

  controls.style.display = 'flex';

  if (previewMode === 'objective' && hasObjective) {
    preview.innerHTML = `
      <div style="font-size:12px;color:#8b95a7;margin-bottom:4px;">Objective preview (how it will render in Zephyr)</div>
      <div style="background:#f8f9fa;color:#111;border:1px solid #ccc;border-radius:6px;padding:10px 12px;font-size:13px;line-height:1.45;">
        ${objectiveHtml}
      </div>`;
    preview.style.display = 'block';
  } else if (previewMode === 'steps' && hasSteps) {
    let html = `<div style="font-size:12px;color:#8b95a7;margin-bottom:6px;">Test Steps preview (Zephyr step-by-step)</div>`;
    steps.forEach((s, i) => {
      const desc = (s.description || s.desc || '').trim();
      const exp = (s.expectedResult || s.expected || s.testData || '').trim();
      html += `
        <div style="margin:4px 0 8px; padding:8px 10px; background:#f8f9fa; border:1px solid #ddd; border-radius:6px; color:#111; font-size:13px; line-height:1.4;">
          <div style="font-weight:600; color:#444; margin-bottom:3px; font-size:12px;">Step ${i + 1}</div>
          <div>${desc || '<em>(no description)</em>'}</div>
          ${exp ? `<div style="margin-top:4px; color:#2e7d32; font-size:12px;"><strong>Expected:</strong> ${exp}</div>` : ''}
        </div>`;
    });
    preview.innerHTML = html;
    preview.style.display = 'block';
  } else {
    // Fallback: if requested mode has no content, show the other one
    if (hasObjective) {
      previewMode = 'objective';
      // re-render with objective
      preview.innerHTML = `
        <div style="font-size:12px;color:#8b95a7;margin-bottom:4px;">Objective preview (how it will render in Zephyr)</div>
        <div style="background:#f8f9fa;color:#111;border:1px solid #ccc;border-radius:6px;padding:10px 12px;font-size:13px;line-height:1.45;">
          ${objectiveHtml}
        </div>`;
      // ensure radio reflects it
      const objRadio = document.querySelector('input[name="pview"][value="objective"]');
      if (objRadio) objRadio.checked = true;
    } else if (hasSteps) {
      previewMode = 'steps';
      // (render steps inline to avoid recursion)
      let html = `<div style="font-size:12px;color:#8b95a7;margin-bottom:6px;">Test Steps preview (Zephyr step-by-step)</div>`;
      steps.forEach((s, i) => {
        const desc = (s.description || s.desc || '').trim();
        const exp = (s.expectedResult || s.expected || s.testData || '').trim();
        html += `
          <div style="margin:4px 0 8px; padding:8px 10px; background:#f8f9fa; border:1px solid #ddd; border-radius:6px; color:#111; font-size:13px; line-height:1.4;">
            <div style="font-weight:600; color:#444; margin-bottom:3px; font-size:12px;">Step ${i + 1}</div>
            <div>${desc || '<em>(no description)</em>'}</div>
            ${exp ? `<div style="margin-top:4px; color:#2e7d32; font-size:12px;"><strong>Expected:</strong> ${exp}</div>` : ''}
          </div>`;
      });
      preview.innerHTML = html;
      const stepsRadio = document.querySelector('input[name="pview"][value="steps"]');
      if (stepsRadio) stepsRadio.checked = true;
    }
    preview.style.display = 'block';
  }
}

function copy() {
  if (!currentPath) return;
  const txt = pre.textContent;
  navigator.clipboard.writeText(txt).then(() => {
    const b = document.getElementById('copy');
    const old = b.textContent;
    b.textContent = 'Copied!';
    setTimeout(() => b.textContent = old, 900);
  });
}

function download() {
  if (!currentPath) return;
  const blob = new Blob([pre.textContent], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = currentPath.split('/').pop() || 'case.json';
  a.click();
}

function toggleMode() {
  prettyMode = !prettyMode;
  document.getElementById('toggle').textContent = prettyMode ? 'Minify' : 'Pretty';
  if (currentPath) show(currentPath);
}

function openRaw() {
  if (!currentPath) return;
  const w = window.open('', '_blank');
  w.document.write('<pre style="font-family:monospace;white-space:pre-wrap;padding:16px">' +
    pre.textContent.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</pre>');
  w.document.close();
}

sel.addEventListener('change', () => show(sel.value));
viewSel.addEventListener('change', (e) => {
  viewMode = e.target.value;
  if (currentPath) show(currentPath);
});
document.getElementById('copy').addEventListener('click', copy);
document.getElementById('download').addEventListener('click', download);
document.getElementById('toggle').addEventListener('click', toggleMode);
document.getElementById('openRaw').addEventListener('click', (e) => { e.preventDefault(); openRaw(); });
filter.addEventListener('input', () => {
  populateSelect(filter.value);
  if (!currentPath || !sel.value) {
    const first = sel.querySelector('option');
    if (first) { sel.value = first.value; show(first.value); }
  }
});

// Preview mode toggle (Objective vs Test Steps)
document.querySelectorAll('input[name="pview"]').forEach(radio => {
  radio.addEventListener('change', (e) => {
    if (e.target.checked) {
      previewMode = e.target.value;
      if (currentPath) show(currentPath);
    }
  });
});

// init
populateSelect('');
viewMode = viewSel.value;
const checkedPreview = document.querySelector('input[name="pview"]:checked');
if (checkedPreview) previewMode = checkedPreview.value;

// pre-select first file
const firstOpt = sel.querySelector('option');
if (firstOpt) {
  sel.value = firstOpt.value;
  show(firstOpt.value);
}
</script>
</body>
</html>
