[pytest]
# Ask CK backend tests. Run from the repo root with the venv interpreter:
#   PYTHONNOUSERSITE=1 .venv/bin/pytest -q
# (PYTHONNOUSERSITE avoids an older fastapi/starlette in ~/.local shadowing the venv one.)
#
# The CK_server package uses BOTH package-style imports (CK_server.main) and flat
# imports (llm.py does `import llm_debug`), so tests need both dirs on sys.path.
# conft.py at the repo root prepends them; pythonpath here documents the same intent.
testpaths = tests
pythonpath = ask-ck/CK-main ask-ck/CK-main/CK_server
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
