! Project 3301 FRER - topology T2, switch C: FRER-unaware transit
! See docs/frer-topologies/README.md for the cabling, MACs and VLANs.
! Transit switch: needs 'spanning-tree vlan-exclude' (IE220, IE340, IE360, IE560 or IE570 on 5.5.6-2). No FRER config.
! Source: FOG 'Advanced configuration example', switch C. Added: hostname, mru 1506.
! port1.0.1 <- A port1.0.3; port1.0.2 -> E port1.0.2.
!
hostname frer-t2-c
!
spanning-tree vlan-exclude 5
!
vlan database
 vlan 5 state enable
!
interface port1.0.1-1.0.2
 switchport
 switchport mode trunk
 switchport trunk allowed vlan add 5
 mru 1506
!
end
