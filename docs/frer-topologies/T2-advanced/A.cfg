! Project 3301 FRER - topology T2, switch A: generation
! See docs/frer-topologies/README.md for the cabling, MACs and VLANs.
! Source: FOG 'Advanced configuration example', switch A (same as T1 A). Added: hostname, mru 1506.
! port1.0.1 = talker; port1.0.2 -> B port1.0.1; port1.0.3 -> C port1.0.1.
!
hostname frer-t2-a
!
spanning-tree vlan-exclude 5
!
vlan database
 vlan 4-5 state enable
!
tsn-stream 1
 dmac 74da.389c.79c6
 vlan 4
!
interface port1.0.1
 switchport
 switchport mode trunk
 switchport trunk allowed vlan add 5
 mru 1506
 tsn-stream-id add 1
!
interface port1.0.2-1.0.3
 switchport
 switchport mode trunk
 switchport trunk allowed vlan add 5
 mru 1506
!
frer 1
 mode generation
 vlan 5
 ingress stream-id-list 1
 egress interface port1.0.2-1.0.3
 instance-enable
!
end
