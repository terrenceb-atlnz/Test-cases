! Project 3301 FRER - topology T4, switch A: generation, 3 paths, unicast stream on VLAN 5 + multicast stream on VLAN 6
! See docs/frer-topologies/README.md for the cabling, MACs and VLANs.
! Not in the FOG: built from the T1 pattern. One FRER VLAN per instance.
! port1.0.1 = talker; port1.0.2-1.0.4 -> B port1.0.2-1.0.4 (same port number at each end).
!
hostname frer-t4-a
!
spanning-tree vlan-exclude 5,6
!
vlan database
 vlan 4-6 state enable
!
tsn-stream 1
 dmac 74da.389c.79c6
 vlan 4
!
tsn-stream 2
 dmac 0300.0000.0101
 vlan 4
!
interface port1.0.1
 switchport
 switchport mode trunk
 switchport trunk allowed vlan add 5,6
 mru 1506
 tsn-stream-id add 1-2
!
interface port1.0.2-1.0.4
 switchport
 switchport mode trunk
 switchport trunk allowed vlan add 5,6
 mru 1506
!
frer 1
 mode generation
 vlan 5
 ingress stream-id-list 1
 egress interface port1.0.2-1.0.4
 instance-enable
!
frer 2
 mode generation
 vlan 6
 ingress stream-id-list 2
 egress interface port1.0.2-1.0.4
 instance-enable
!
end
