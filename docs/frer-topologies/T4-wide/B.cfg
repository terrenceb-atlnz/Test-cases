! Project 3301 FRER - topology T4, switch B: recovery, terminate: unicast to listener 1, multicast to listeners 1 and 2
! See docs/frer-topologies/README.md for the cabling, MACs and VLANs.
! Not in the FOG: built from the T1 pattern. One FRER VLAN per instance.
! port1.0.1 = listener 1; port1.0.5 = listener 2 (multicast only);
! port1.0.2-1.0.4 <- A port1.0.2-1.0.4.
!
hostname frer-t4-b
!
spanning-tree vlan-exclude 5,6
!
vlan database
 vlan 5-6 state enable
!
tsn-stream 1
 dmac 74da.389c.79c6
 vlan 5
!
tsn-stream 2
 dmac 0300.0000.0101
 vlan 6
!
interface port1.0.1
 switchport
 switchport mode trunk
 switchport trunk allowed vlan add 5,6
 mru 1506
!
interface port1.0.5
 switchport
 switchport mode trunk
 switchport trunk allowed vlan add 6
 mru 1506
!
interface port1.0.2-1.0.4
 switchport
 switchport mode trunk
 switchport trunk allowed vlan add 5,6
 mru 1506
 tsn-stream-id add 1-2
!
frer 1
 mode recovery
 vlan 5
 ingress stream-id-list 1
 egress interface port1.0.1
 recovery algorithm match
 recovery terminate
 recovery reset-timeout 128
 instance-enable
!
frer 2
 mode recovery
 vlan 6
 ingress stream-id-list 2
 egress interface port1.0.1,port1.0.5
 recovery algorithm match
 recovery terminate
 recovery reset-timeout 128
 instance-enable
!
end
