! Project 3301 FRER - topology T1, switch B: recovery, terminate
! See docs/frer-topologies/README.md for the cabling, MACs and VLANs.
! Source: FOG 'Simplest FRER network example', switch B. Added: hostname, mru 1506.
! port1.0.1 = listener; port1.0.2 <- A port1.0.2; port1.0.3 <- A port1.0.3.
!
hostname frer-t1-b
!
spanning-tree vlan-exclude 5
!
vlan database
 vlan 5 state enable
!
tsn-stream 1
 dmac 74da.389c.79c6
 vlan 5
!
interface port1.0.1
 switchport
 switchport mode trunk
 switchport trunk allowed vlan add 5
 mru 1506
!
interface port1.0.2-1.0.3
 switchport
 switchport mode trunk
 switchport trunk allowed vlan add 5
 mru 1506
 tsn-stream-id add 1
!
frer 1
 mode recovery
 vlan 5
 ingress stream-id-list 1
 egress interface port1.0.1
 recovery algorithm match
 recovery terminate
 recovery reset-timeout 128
 instance-enable
!
end
