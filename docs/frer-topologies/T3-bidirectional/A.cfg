! Project 3301 FRER - topology T3, switch A: generation A->B on VLAN 5, recovery B->A on VLAN 6
! See docs/frer-topologies/README.md for the cabling, MACs and VLANs.
! Source: FOG 'Bi-directional FRER', switch A. Added: hostname, mru 1506.
! port1.0.1 = end station 74da.389c.79c5; port1.0.2 <-> B port1.0.2; port1.0.3 <-> B port1.0.3.
!
hostname frer-t3-a
!
spanning-tree vlan-exclude 5,6
!
vlan database
 vlan 4-6 state enable
!
tsn-stream 1
 dmac 74da.389c.79c6
 vlan 4
!
tsn-stream 2
 dmac 74da.389c.79c5
 vlan 6
!
interface port1.0.1
 switchport
 switchport mode trunk
 switchport trunk allowed vlan add 5,6
 mru 1506
 tsn-stream-id add 1
!
interface port1.0.2-1.0.3
 switchport
 switchport mode trunk
 switchport trunk allowed vlan add 5,6
 mru 1506
 tsn-stream-id add 2
!
frer 1
 mode generation
 vlan 5
 ingress stream-id-list 1
 egress interface port1.0.2-1.0.3
 instance-enable
!
frer 2
 mode recovery
 vlan 6
 ingress stream-id-list 2
 egress interface port1.0.1
 recovery algorithm match
 recovery terminate
 recovery reset-timeout 128
 instance-enable
!
end
