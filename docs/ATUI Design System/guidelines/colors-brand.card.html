<!-- @dsCard group="Colors" viewport="700x150" name="Brand & accent" subtitle="Brand primary (blue A400) drives primary buttons, links, focus, active state" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--token-surface-foreground);margin:0}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--token-text-muted)}.chip{height:44px;border-radius:var(--token-border-radius-md);border:1px solid var(--token-border-muted)}.n{color:var(--token-text-foreground);font-size:11px;font-weight:500}.mono{font-family:var(--token-font-family-mono);font-size:10px}.row{display:flex;gap:12px;align-items:center}</style>
</head><body><div class="g" style="grid-template-columns:repeat(5,minmax(0,1fr))"><div class="sw"><div class="chip" style="background:var(--token-color-brand-primary)"></div><span class="n">Brand primary</span><span class="mono">--token-color-brand-primary</span></div><div class="sw"><div class="chip" style="background:var(--token-state-active-accent)"></div><span class="n">Active accent</span><span class="mono">--token-state-active-accent</span></div><div class="sw"><div class="chip" style="background:var(--token-text-active)"></div><span class="n">Link / active text</span><span class="mono">--token-text-active</span></div><div class="sw"><div class="chip" style="background:var(--token-state-active-background)"></div><span class="n">Active background</span><span class="mono">--token-state-active-background</span></div><div class="sw"><div class="chip" style="background:var(--token-state-active-background-inv)"></div><span class="n">Active bg inv</span><span class="mono">--token-state-active-background-inv</span></div></div></body></html>
