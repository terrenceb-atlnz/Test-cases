<!-- @dsCard group="Colors" viewport="700x150" name="Text roles" subtitle="One class per role — foreground, secondary, tertiary, muted, disabled, inv" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--token-surface-foreground);margin:0}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--token-text-muted)}.chip{height:44px;border-radius:var(--token-border-radius-md);border:1px solid var(--token-border-muted)}.n{color:var(--token-text-foreground);font-size:11px;font-weight:500}.mono{font-family:var(--token-font-family-mono);font-size:10px}.row{display:flex;gap:12px;align-items:center}</style>
</head><body><div class="g" style="grid-template-columns:repeat(6,minmax(0,1fr))"><div class="sw"><div class="chip" style="background:var(--token-text-foreground)"></div><span class="n">Foreground</span><span class="mono">--token-text-foreground</span></div><div class="sw"><div class="chip" style="background:var(--token-text-secondary)"></div><span class="n">Secondary</span><span class="mono">--token-text-secondary</span></div><div class="sw"><div class="chip" style="background:var(--token-text-tertiary)"></div><span class="n">Tertiary</span><span class="mono">--token-text-tertiary</span></div><div class="sw"><div class="chip" style="background:var(--token-text-muted)"></div><span class="n">Muted</span><span class="mono">--token-text-muted</span></div><div class="sw"><div class="chip" style="background:var(--token-text-disabled)"></div><span class="n">Disabled</span><span class="mono">--token-text-disabled</span></div><div class="sw"><div class="chip" style="background:var(--token-text-inv)"></div><span class="n">Inverse</span><span class="mono">--token-text-inv</span></div></div></body></html>
