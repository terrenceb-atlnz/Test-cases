<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--token-surface-foreground);margin:0}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--token-text-muted)}.chip{height:44px;border-radius:var(--token-border-radius-md);border:1px solid var(--token-border-muted)}.n{color:var(--token-text-foreground);font-size:11px;font-weight:500}.mono{font-family:var(--token-font-family-mono);font-size:10px}.row{display:flex;gap:12px;align-items:center}</style>
</head><body><div class="row" style="margin-bottom:8px"><span class="mono" style="width:120px">alert</span><div class="row" style="gap:3px;flex:1"><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-alert-1)"></div><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-alert-2)"></div><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-alert-3)"></div><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-alert-4)"></div></div><span style="font-size:10px;color:var(--token-text-muted);width:170px">ok · warn · error · no data</span></div><div class="row" style="margin-bottom:8px"><span class="mono" style="width:120px">device-status</span><div class="row" style="gap:3px;flex:1"><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-device-status-1)"></div><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-device-status-2)"></div><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-device-status-3)"></div><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-device-status-4)"></div><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-device-status-5)"></div></div><span style="font-size:10px;color:var(--token-text-muted);width:170px">up · degraded · down · unknown · other</span></div><div class="row" style="margin-bottom:8px"><span class="mono" style="width:120px">onboarding-status</span><div class="row" style="gap:3px;flex:1"><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-onboarding-status-1)"></div><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-onboarding-status-2)"></div><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-onboarding-status-3)"></div><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-onboarding-status-4)"></div><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-onboarding-status-5)"></div><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-onboarding-status-6)"></div></div><span style="font-size:10px;color:var(--token-text-muted);width:170px"></span></div><div class="row" style="margin-bottom:8px"><span class="mono" style="width:120px">events</span><div class="row" style="gap:3px;flex:1"><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-events-1)"></div><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-events-2)"></div><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-events-3)"></div></div><span style="font-size:10px;color:var(--token-text-muted);width:170px">critical · warning · ok</span></div><div class="row" style="margin-bottom:8px"><span class="mono" style="width:120px">sequential</span><div class="row" style="gap:3px;flex:1"><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-sequential-1)"></div><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-sequential-2)"></div><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-sequential-3)"></div><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-sequential-4)"></div><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-sequential-5)"></div><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-sequential-6)"></div><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-sequential-7)"></div><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-sequential-8)"></div><div style="flex:1;height:18px;border-radius:3px;background:var(--chart-sequential-9)"></div></div><span style="font-size:10px;color:var(--token-text-muted);width:170px">low → high</span></div></body></html>
