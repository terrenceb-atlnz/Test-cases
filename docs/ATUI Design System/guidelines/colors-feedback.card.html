<!-- @dsCard group="Colors" viewport="700x150" name="Feedback surfaces" subtitle="Message / badge fills: 50% mix of the state background into the root colour" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--token-surface-foreground);margin:0}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--token-text-muted)}.chip{height:44px;border-radius:var(--token-border-radius-md);border:1px solid var(--token-border-muted)}.n{color:var(--token-text-foreground);font-size:11px;font-weight:500}.mono{font-family:var(--token-font-family-mono);font-size:10px}.row{display:flex;gap:12px;align-items:center}</style>
</head><body><div class="g" style="grid-template-columns:repeat(4,minmax(0,1fr))"><div class="sw"><div style="border-radius:var(--token-message-radius);padding:12px;background:var(--token-feedback-success-background);color:var(--token-text-foreground);font-size:12px;display:flex;gap:8px;align-items:center"><span style="width:10px;height:10px;border-radius:99px;background:var(--token-feedback-success-accent)"></span>success</div><span class="mono">--token-feedback-success-background</span></div><div class="sw"><div style="border-radius:var(--token-message-radius);padding:12px;background:var(--token-feedback-warning-background);color:var(--token-text-foreground);font-size:12px;display:flex;gap:8px;align-items:center"><span style="width:10px;height:10px;border-radius:99px;background:var(--token-feedback-warning-accent)"></span>warning</div><span class="mono">--token-feedback-warning-background</span></div><div class="sw"><div style="border-radius:var(--token-message-radius);padding:12px;background:var(--token-feedback-error-background);color:var(--token-text-foreground);font-size:12px;display:flex;gap:8px;align-items:center"><span style="width:10px;height:10px;border-radius:99px;background:var(--token-feedback-error-accent)"></span>error</div><span class="mono">--token-feedback-error-background</span></div><div class="sw"><div style="border-radius:var(--token-message-radius);padding:12px;background:var(--token-feedback-info-background);color:var(--token-text-foreground);font-size:12px;display:flex;gap:8px;align-items:center"><span style="width:10px;height:10px;border-radius:99px;background:var(--token-feedback-info-accent)"></span>info</div><span class="mono">--token-feedback-info-background</span></div></div></body></html>
