<!-- @dsCard group="Colors" viewport="700x260" name="Status pairs" subtitle="Soft = background + foreground; solid = -inv pair; accent for markers" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--token-surface-foreground);margin:0}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--token-text-muted)}.chip{height:44px;border-radius:var(--token-border-radius-md);border:1px solid var(--token-border-muted)}.n{color:var(--token-text-foreground);font-size:11px;font-weight:500}.mono{font-family:var(--token-font-family-mono);font-size:10px}.row{display:flex;gap:12px;align-items:center}</style>
</head><body><div class="g" style="grid-template-columns:repeat(5,1fr)"><div class="sw"><div style="border-radius:6px;padding:10px 8px;background:var(--token-state-success-background);color:var(--token-state-success-foreground);font-size:12px;font-weight:500">Success soft</div><div style="border-radius:6px;padding:10px 8px;background:var(--token-state-success-background-inv);color:var(--token-state-success-foreground-inv);font-size:12px;font-weight:500">Success solid</div><div class="chip" style="height:10px;background:var(--token-state-success-accent)"></div><span class="mono">--token-state-success-*</span></div><div class="sw"><div style="border-radius:6px;padding:10px 8px;background:var(--token-state-warning-background);color:var(--token-state-warning-foreground);font-size:12px;font-weight:500">Warning soft</div><div style="border-radius:6px;padding:10px 8px;background:var(--token-state-warning-background-inv);color:var(--token-state-warning-foreground-inv);font-size:12px;font-weight:500">Warning solid</div><div class="chip" style="height:10px;background:var(--token-state-warning-accent)"></div><span class="mono">--token-state-warning-*</span></div><div class="sw"><div style="border-radius:6px;padding:10px 8px;background:var(--token-state-error-background);color:var(--token-state-error-foreground);font-size:12px;font-weight:500">Error soft</div><div style="border-radius:6px;padding:10px 8px;background:var(--token-state-error-background-inv);color:var(--token-state-error-foreground-inv);font-size:12px;font-weight:500">Error solid</div><div class="chip" style="height:10px;background:var(--token-state-error-accent)"></div><span class="mono">--token-state-error-*</span></div><div class="sw"><div style="border-radius:6px;padding:10px 8px;background:var(--token-state-info-background);color:var(--token-state-info-foreground);font-size:12px;font-weight:500">Info soft</div><div style="border-radius:6px;padding:10px 8px;background:var(--token-state-info-background-inv);color:var(--token-state-info-foreground-inv);font-size:12px;font-weight:500">Info solid</div><div class="chip" style="height:10px;background:var(--token-state-info-accent)"></div><span class="mono">--token-state-info-*</span></div><div class="sw"><div style="border-radius:6px;padding:10px 8px;background:var(--token-state-active-background);color:var(--token-state-active-foreground);font-size:12px;font-weight:500">Active soft</div><div style="border-radius:6px;padding:10px 8px;background:var(--token-state-active-background-inv);color:var(--token-state-active-foreground-inv);font-size:12px;font-weight:500">Active solid</div><div class="chip" style="height:10px;background:var(--token-state-active-accent)"></div><span class="mono">--token-state-active-*</span></div></div></body></html>
