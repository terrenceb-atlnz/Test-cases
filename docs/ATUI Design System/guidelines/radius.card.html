<!-- @dsCard group="Spacing" viewport="700x130" name="Radii" subtitle="md (0.3rem) for controls/badges, lg (0.46rem) for cards/menus/messages" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--token-surface-foreground);margin:0}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--token-text-muted)}.chip{height:44px;border-radius:var(--token-border-radius-md);border:1px solid var(--token-border-muted)}.n{color:var(--token-text-foreground);font-size:11px;font-weight:500}.mono{font-family:var(--token-font-family-mono);font-size:10px}.row{display:flex;gap:12px;align-items:center}</style>
</head><body><div class="row" style="gap:24px"><div class="sw"><div style="width:96px;height:56px;border:1px solid var(--token-border-default);background:var(--token-surface-1);border-radius:var(--token-border-radius-sm)"></div><span class="n">radius-sm</span><span class="mono">0.15rem ≈ 2px</span></div><div class="sw"><div style="width:96px;height:56px;border:1px solid var(--token-border-default);background:var(--token-surface-1);border-radius:var(--token-border-radius-md)"></div><span class="n">radius-md</span><span class="mono">0.3rem ≈ 4px</span></div><div class="sw"><div style="width:96px;height:56px;border:1px solid var(--token-border-default);background:var(--token-surface-1);border-radius:var(--token-border-radius-lg)"></div><span class="n">radius-lg</span><span class="mono">0.46rem ≈ 6px</span></div><div class="sw"><div style="width:96px;height:56px;border:1px solid var(--token-border-default);background:var(--token-surface-1);border-radius:999px"></div><span class="n">full</span><span class="mono">toggle, avatar</span></div></div></body></html>
