<!-- @dsCard group="Colors" viewport="700x110" name="Chart · categorical" subtitle="10 slots for unordered categories; group extras into "Other"" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--token-surface-foreground);margin:0}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--token-text-muted)}.chip{height:44px;border-radius:var(--token-border-radius-md);border:1px solid var(--token-border-muted)}.n{color:var(--token-text-foreground);font-size:11px;font-weight:500}.mono{font-family:var(--token-font-family-mono);font-size:10px}.row{display:flex;gap:12px;align-items:center}</style>
</head><body><div class="row" style="gap:4px"><div class="sw" style="flex:1"><div class="chip" style="background:var(--chart-categorical-1);border:0"></div><span class="mono">1</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--chart-categorical-2);border:0"></div><span class="mono">2</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--chart-categorical-3);border:0"></div><span class="mono">3</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--chart-categorical-4);border:0"></div><span class="mono">4</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--chart-categorical-5);border:0"></div><span class="mono">5</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--chart-categorical-6);border:0"></div><span class="mono">6</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--chart-categorical-7);border:0"></div><span class="mono">7</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--chart-categorical-8);border:0"></div><span class="mono">8</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--chart-categorical-9);border:0"></div><span class="mono">9</span></div><div class="sw" style="flex:1"><div class="chip" style="background:var(--chart-categorical-10);border:0"></div><span class="mono">10</span></div></div></body></html>
