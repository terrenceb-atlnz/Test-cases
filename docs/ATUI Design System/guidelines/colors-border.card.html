<!-- @dsCard group="Colors" viewport="700x140" name="Borders" subtitle="Muted hairlines for cards/dividers; input border is the stronger impact grey" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--token-surface-foreground);margin:0}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--token-text-muted)}.chip{height:44px;border-radius:var(--token-border-radius-md);border:1px solid var(--token-border-muted)}.n{color:var(--token-text-foreground);font-size:11px;font-weight:500}.mono{font-family:var(--token-font-family-mono);font-size:10px}.row{display:flex;gap:12px;align-items:center}</style>
</head><body><div class="g" style="grid-template-columns:repeat(5,minmax(0,1fr))"><div class="sw"><div class="chip" style="background:var(--token-border-muted)"></div><span class="n">Muted</span><span class="mono">--token-border-muted</span></div><div class="sw"><div class="chip" style="background:var(--token-border-default)"></div><span class="n">Default</span><span class="mono">--token-border-default</span></div><div class="sw"><div class="chip" style="background:var(--token-border-impact)"></div><span class="n">Impact / input</span><span class="mono">--token-border-impact</span></div><div class="sw"><div class="chip" style="background:var(--token-border-error)"></div><span class="n">Error</span><span class="mono">--token-border-error</span></div><div class="sw"><div class="chip" style="background:var(--token-border-active)"></div><span class="n">Active / focus</span><span class="mono">--token-border-active</span></div></div></body></html>
