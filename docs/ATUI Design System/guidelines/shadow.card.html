<!-- @dsCard group="Spacing" viewport="700x150" name="Shadows" subtitle="Flat house style — hairline borders first; shadow-2/3 only for menus, dialogs, panels" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--token-surface-foreground);margin:0}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--token-text-muted)}.chip{height:44px;border-radius:var(--token-border-radius-md);border:1px solid var(--token-border-muted)}.n{color:var(--token-text-foreground);font-size:11px;font-weight:500}.mono{font-family:var(--token-font-family-mono);font-size:10px}.row{display:flex;gap:12px;align-items:center}</style>
</head><body><div style="background:var(--token-surface-background);padding:20px;margin:-16px"><div class="row" style="gap:20px"><div class="sw"><div style="width:100px;height:60px;background:var(--token-surface-foreground);border-radius:var(--token-border-radius-lg);box-shadow:var(--token-shadow-1)"></div><span class="mono">--token-shadow-1</span></div><div class="sw"><div style="width:100px;height:60px;background:var(--token-surface-foreground);border-radius:var(--token-border-radius-lg);box-shadow:var(--token-shadow-2)"></div><span class="mono">--token-shadow-2</span></div><div class="sw"><div style="width:100px;height:60px;background:var(--token-surface-foreground);border-radius:var(--token-border-radius-lg);box-shadow:var(--token-shadow-3)"></div><span class="mono">--token-shadow-3</span></div><div class="sw"><div style="width:100px;height:60px;background:var(--token-surface-foreground);border-radius:var(--token-border-radius-lg);box-shadow:var(--token-shadow-sm)"></div><span class="mono">--token-shadow-sm</span></div><div class="sw"><div style="width:100px;height:60px;background:var(--token-surface-foreground);border-radius:var(--token-border-radius-lg);box-shadow:var(--token-shadow-md)"></div><span class="mono">--token-shadow-md</span></div></div></div></body></html>
