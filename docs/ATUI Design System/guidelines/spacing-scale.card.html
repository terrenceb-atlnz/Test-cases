<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="Literal px scale — p-8 means 8px. Rhythm: 4/8 in controls, 16/24 between groups" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--token-surface-foreground);margin:0}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--token-text-muted)}.chip{height:44px;border-radius:var(--token-border-radius-md);border:1px solid var(--token-border-muted)}.n{color:var(--token-text-foreground);font-size:11px;font-weight:500}.mono{font-family:var(--token-font-family-mono);font-size:10px}.row{display:flex;gap:12px;align-items:center}</style>
</head><body><div style="display:flex;flex-direction:column;gap:3px"><div class="row" style="gap:8px"><span class="mono" style="width:90px">--token-space-2</span><div style="height:8px;width:8px;background:var(--token-state-active-accent);border-radius:2px"></div><span class="mono">2px</span></div><div class="row" style="gap:8px"><span class="mono" style="width:90px">--token-space-4</span><div style="height:8px;width:16px;background:var(--token-state-active-accent);border-radius:2px"></div><span class="mono">4px</span></div><div class="row" style="gap:8px"><span class="mono" style="width:90px">--token-space-8</span><div style="height:8px;width:32px;background:var(--token-state-active-accent);border-radius:2px"></div><span class="mono">8px</span></div><div class="row" style="gap:8px"><span class="mono" style="width:90px">--token-space-12</span><div style="height:8px;width:48px;background:var(--token-state-active-accent);border-radius:2px"></div><span class="mono">12px</span></div><div class="row" style="gap:8px"><span class="mono" style="width:90px">--token-space-16</span><div style="height:8px;width:64px;background:var(--token-state-active-accent);border-radius:2px"></div><span class="mono">16px</span></div><div class="row" style="gap:8px"><span class="mono" style="width:90px">--token-space-20</span><div style="height:8px;width:80px;background:var(--token-state-active-accent);border-radius:2px"></div><span class="mono">20px</span></div><div class="row" style="gap:8px"><span class="mono" style="width:90px">--token-space-24</span><div style="height:8px;width:96px;background:var(--token-state-active-accent);border-radius:2px"></div><span class="mono">24px</span></div><div class="row" style="gap:8px"><span class="mono" style="width:90px">--token-space-32</span><div style="height:8px;width:128px;background:var(--token-state-active-accent);border-radius:2px"></div><span class="mono">32px</span></div><div class="row" style="gap:8px"><span class="mono" style="width:90px">--token-space-40</span><div style="height:8px;width:160px;background:var(--token-state-active-accent);border-radius:2px"></div><span class="mono">40px</span></div><div class="row" style="gap:8px"><span class="mono" style="width:90px">--token-space-48</span><div style="height:8px;width:192px;background:var(--token-state-active-accent);border-radius:2px"></div><span class="mono">48px</span></div><div class="row" style="gap:8px"><span class="mono" style="width:90px">--token-space-64</span><div style="height:8px;width:256px;background:var(--token-state-active-accent);border-radius:2px"></div><span class="mono">64px</span></div></div></body></html>
