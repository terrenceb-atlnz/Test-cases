<!-- @dsCard group="Colors" viewport="700x170" name="Dark theme" subtitle="data-theme="dark" on <html> — every semantic token re-maps" -->
<!DOCTYPE html>
<html data-theme="dark" style="color-scheme:dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--token-surface-foreground);margin:0}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--token-text-muted)}.chip{height:44px;border-radius:var(--token-border-radius-md);border:1px solid var(--token-border-muted)}.n{color:var(--token-text-foreground);font-size:11px;font-weight:500}.mono{font-family:var(--token-font-family-mono);font-size:10px}.row{display:flex;gap:12px;align-items:center}</style>
</head><body><div class="g" style="grid-template-columns:repeat(6,minmax(0,1fr))"><div class="sw"><div class="chip" style="background:var(--token-surface-background)"></div><span class="n">Background</span><span class="mono">--token-surface-background</span></div><div class="sw"><div class="chip" style="background:var(--token-surface-foreground)"></div><span class="n">Foreground</span><span class="mono">--token-surface-foreground</span></div><div class="sw"><div class="chip" style="background:var(--token-surface-0)"></div><span class="n">Surface 0</span><span class="mono">--token-surface-0</span></div><div class="sw"><div class="chip" style="background:var(--token-text-foreground)"></div><span class="n">Text</span><span class="mono">--token-text-foreground</span></div><div class="sw"><div class="chip" style="background:var(--token-text-muted)"></div><span class="n">Muted</span><span class="mono">--token-text-muted</span></div><div class="sw"><div class="chip" style="background:var(--token-state-active-accent)"></div><span class="n">Active</span><span class="mono">--token-state-active-accent</span></div></div></body></html>
