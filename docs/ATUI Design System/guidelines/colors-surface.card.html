<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Elevation: page background, raised foreground, recessed 0/1/2, inverse overlay" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px;background:var(--token-surface-foreground);margin:0}.g{display:grid;gap:8px}.sw{display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--token-text-muted)}.chip{height:44px;border-radius:var(--token-border-radius-md);border:1px solid var(--token-border-muted)}.n{color:var(--token-text-foreground);font-size:11px;font-weight:500}.mono{font-family:var(--token-font-family-mono);font-size:10px}.row{display:flex;gap:12px;align-items:center}</style>
</head><body><div class="g" style="grid-template-columns:repeat(6,minmax(0,1fr))"><div class="sw"><div class="chip" style="background:var(--token-surface-background)"></div><span class="n">Background</span><span class="mono">--token-surface-background</span></div><div class="sw"><div class="chip" style="background:var(--token-surface-foreground)"></div><span class="n">Foreground</span><span class="mono">--token-surface-foreground</span></div><div class="sw"><div class="chip" style="background:var(--token-surface-0)"></div><span class="n">Surface 0</span><span class="mono">--token-surface-0</span></div><div class="sw"><div class="chip" style="background:var(--token-surface-1)"></div><span class="n">Surface 1</span><span class="mono">--token-surface-1</span></div><div class="sw"><div class="chip" style="background:var(--token-surface-2)"></div><span class="n">Surface 2</span><span class="mono">--token-surface-2</span></div><div class="sw"><div class="chip" style="background:var(--token-surface-inv)"></div><span class="n">Inverse / overlay</span><span class="mono">--token-surface-inv</span></div></div></body></html>
