<!-- @dsCard group="OneConnect" viewport="1440x900" name="OneConnect app" subtitle="Header, sidebar, Sites list with peek, delete dialog, Dashboard, Events, AI rail" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OneConnect — ATUI UI kit</title>
<link rel="icon" href="../../assets/at-logo.svg">
<link rel="stylesheet" href="../../styles.css">
<style>html,body,#root{height:100%;margin:0}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="Sites.jsx"></script>
<script type="text/babel" src="Pages.jsx"></script>
<script type="text/babel">
function App() {
  const [route, setRoute] = React.useState(localStorage.getItem("oc-route") || "sites");
  const [collapsed, setCollapsed] = React.useState(false);
  const [dark, setDark] = React.useState(false);
  const [peek, setPeek] = React.useState(null);
  const [del, setDel] = React.useState(null);
  const [creating, setCreating] = React.useState(false);
  const [assistant, setAssistant] = React.useState(false);
  const [toasts, setToasts] = React.useState([]);
  const { Toaster, Placeholder } = window.ATUIDesignSystem_dbdde4;
  React.useEffect(() => { document.documentElement.dataset.theme = dark ? "dark" : "light"; }, [dark]);
  const go = (r) => { setRoute(r); localStorage.setItem("oc-route", r); setPeek(null); };
  const toast = (t) => { const id = Date.now(); setToasts((x) => [...x, { id, ...t }]); setTimeout(() => setToasts((x) => x.filter((y) => y.id !== id)), 4000); };
  let page;
  if (route === "sites") page = <SitesList onPeek={setPeek} onDelete={setDel} onNew={() => setCreating(true)} />;
  else if (route === "dashboard") page = <DashboardPage />;
  else if (route === "events") page = <EventsPage />;
  else page = <div style={{ padding: 16 }}><Placeholder icon="folder" placeholder_title={(NAV.find((n) => n.id === route) || { label: "This workspace" }).label} content="Not recreated in this UI kit — see Sites, Dashboard and Events." /></div>;
  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
      <AppHeader dark={dark} setDark={setDark} onAssistant={() => setAssistant(!assistant)} />
      <div style={{ display: "flex", flex: 1, minHeight: 0, position: "relative" }}>
        <AppSidebar route={route} go={go} collapsed={collapsed} setCollapsed={setCollapsed} />
        <main style={{ flex: 1, minWidth: 0, overflowY: "auto", background: "var(--token-surface-background)" }}>{page}</main>
        <AssistantRail open={assistant} onClose={() => setAssistant(false)} />
      </div>
      <SitePeek site={peek} onClose={() => setPeek(null)} onDelete={(s) => setDel(s)} />
      <DeleteSiteDialog site={del} onClose={() => setDel(null)} onConfirm={(s) => { setDel(null); setPeek(null); toast({ type: "success", toast_title: s.name + " deleted" }); }} />
      <NewSitePanel open={creating} onClose={() => setCreating(false)} onCreate={(n) => { setCreating(false); toast({ type: "success", toast_title: "Site created", message: n + " was added to Contoso Ltd." }); }} />
      <Toaster toasts={toasts} onDismiss={(id) => setToasts((x) => x.filter((y) => y.id !== id))} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
